<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Webinar Consultation – Availability</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4ff; color: #1a1a2e;
    min-height: 100vh; padding: 32px 24px 60px;
  }
  .page-wrapper { max-width: 1100px; margin: 0 auto; }

  /* Header */
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { font-size: 26px; font-weight: 800; color: #0f172a; letter-spacing: -0.3px; }
  .header .sub { margin-top: 6px; color: #64748b; font-size: 14px; font-weight: 500; }
  .meta-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .meta-chip {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
    padding: 5px 14px; font-size: 13px; color: #475569; font-weight: 500;
  }
  .meta-chip strong { color: #0f172a; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* Section headers */
  .section-headers {
    display: grid;
    grid-template-columns: 200px 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .section-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: #94a3b8; text-align: center;
    padding: 6px 0;
  }
  .section-label.tonight { color: #7c3aed; }
  .section-label.tomorrow { color: #0369a1; }

  /* Closer rows */
  .closer-list { display: flex; flex-direction: column; gap: 8px; }
  .closer-row {
    display: grid;
    grid-template-columns: 200px 1fr 1fr;
    gap: 12px;
    align-items: stretch;
  }
  .closer-name-cell {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column;
    justify-content: center;
  }
  .closer-name { font-size: 14px; font-weight: 700; color: #0f172a; }
  .closer-count {
    font-size: 11px; color: #94a3b8; font-weight: 500; margin-top: 2px;
  }
  .closer-count .cnt { font-weight: 800; }
  .cnt-tonight { color: #7c3aed; }
  .cnt-tomorrow { color: #0369a1; }

  /* Slot panels */
  .slot-panel {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 12px 14px; min-height: 58px; display: flex;
    flex-wrap: wrap; gap: 6px; align-content: flex-start; align-items: flex-start;
  }
  .slot-panel.tonight-panel { border-left: 3px solid #7c3aed; }
  .slot-panel.tomorrow-panel { border-left: 3px solid #0369a1; }
  .slot-panel.empty { align-items: center; }

  .slot-pill {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; font-size: 12px; font-weight: 600;
    padding: 4px 10px; white-space: nowrap;
  }
  .slot-pill.tonight-pill {
    background: #f3f0ff; color: #6d28d9; border: 1px solid #ddd6fe;
  }
  .slot-pill.tomorrow-pill {
    background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
  }
  .no-slots {
    font-size: 12px; color: #cbd5e1; font-style: italic; font-weight: 500;
  }

  /* Summary bar */
  .summary-bar {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .summary-stat {
    text-align: center;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 12px 24px;
  }
  .summary-stat .num { font-size: 28px; font-weight: 900; }
  .summary-stat .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: #94a3b8; margin-top: 2px; }
  .stat-tonight .num { color: #7c3aed; }
  .stat-tomorrow .num { color: #0369a1; }

  /* Error / loading */
  .loading { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 15px; }
  .error-banner {
    background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px;
    padding: 10px 16px; font-size: 13px; color: #92400e; margin-bottom: 16px;
    display: none;
  }

  @media (max-width: 700px) {
    .section-headers, .closer-row {
      grid-template-columns: 1fr;
    }
    .section-headers { display: none; }
    .slot-panel.tonight-panel::before {
      content: "Tonight (after 8pm EDT)";
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .07em; color: #7c3aed; margin-bottom: 4px;
      display: block; width: 100%;
    }
    .slot-panel.tomorrow-panel::before {
      content: "Tomorrow";
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .07em; color: #0369a1; margin-bottom: 4px;
      display: block; width: 100%;
    }
  }
</style>
</head>
<body>
<div class="page-wrapper">

  <div class="header">
    <h1>&#128205; Post Webinar Consultation</h1>
    <p class="sub">Available Slots per Closer &bull; All Times in EDT</p>
    <div class="meta-row">
      <span class="meta-chip"><span class="live-dot"></span><span id="liveStatus">Loading…</span></span>
      <span class="meta-chip" id="tonightLabel">—</span>
      <span class="meta-chip" id="tomorrowLabel">—</span>
      <span class="meta-chip">Updated: <strong id="updatedAt">—</strong></span>
    </div>
  </div>

  <div class="error-banner" id="errorBanner">
    &#9888; Could not reach the API — showing last known data.
  </div>

  <div class="summary-bar" id="summaryBar"></div>

  <div class="section-headers">
    <div class="section-label">Closer</div>
    <div class="section-label tonight" id="tonightColLabel">Tonight · after 8 PM EDT</div>
    <div class="section-label tomorrow" id="tomorrowColLabel">Tomorrow · All Day</div>
  </div>

  <div id="mainContent" class="closer-list">
    <div class="loading">Loading availability…</div>
  </div>

</div>

<script>
async function loadData() {
  let data, error = false;
  try {
    const res = await fetch('/api/webinar-availability');
    if (!res.ok) throw new Error('bad status');
    data = await res.json();
  } catch (e) {
    error = true;
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('liveStatus').textContent = 'Error';
    document.getElementById('mainContent').innerHTML =
      '<div class="loading">Failed to load data. Please refresh.</div>';
    return;
  }

  document.getElementById('liveStatus').textContent = 'Live';
  document.getElementById('tonightLabel').innerHTML =
    '&#127769; Tonight: <strong>' + data.today_label + '</strong>';
  document.getElementById('tomorrowLabel').innerHTML =
    '&#9728;&#65039; Tomorrow: <strong>' + data.tomorrow_label + '</strong>';
  document.getElementById('updatedAt').textContent = data.updated_at;
  document.getElementById('tonightColLabel').textContent =
    'Tonight · after 8 PM EDT — ' + data.today_label;
  document.getElementById('tomorrowColLabel').textContent =
    'Tomorrow · All Day — ' + data.tomorrow_label;

  const closers = data.closers || [];

  // Summary totals
  const totalTonight  = closers.reduce((s, c) => s + c.tonight_count, 0);
  const totalTomorrow = closers.reduce((s, c) => s + c.tomorrow_count, 0);
  const activeTonight  = closers.filter(c => c.tonight_count > 0).length;
  const activeTomorrow = closers.filter(c => c.tomorrow_count > 0).length;

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-stat stat-tonight">
      <div class="num">${totalTonight}</div>
      <div class="lbl">Total Tonight Slots</div>
    </div>
    <div class="summary-stat stat-tonight">
      <div class="num">${activeTonight}</div>
      <div class="lbl">Closers Available Tonight</div>
    </div>
    <div class="summary-stat stat-tomorrow">
      <div class="num">${totalTomorrow}</div>
      <div class="lbl">Total Tomorrow Slots</div>
    </div>
    <div class="summary-stat stat-tomorrow">
      <div class="num">${activeTomorrow}</div>
      <div class="lbl">Closers Available Tomorrow</div>
    </div>
  `;

  function buildSlots(slots, pillClass) {
    if (!slots || slots.length === 0)
      return '<span class="no-slots">No availability</span>';
    return slots.map(s => `<span class="slot-pill ${pillClass}">${s}</span>`).join('');
  }

  const rows = closers.map(c => `
    <div class="closer-row">
      <div class="closer-name-cell">
        <div class="closer-name">${c.name}</div>
        <div class="closer-count">
          <span class="cnt cnt-tonight">${c.tonight_count}</span> tonight &nbsp;·&nbsp;
          <span class="cnt cnt-tomorrow">${c.tomorrow_count}</span> tomorrow
        </div>
      </div>
      <div class="slot-panel tonight-panel ${c.tonight_count === 0 ? 'empty' : ''}">
        ${buildSlots(c.tonight_slots, 'tonight-pill')}
      </div>
      <div class="slot-panel tomorrow-panel ${c.tomorrow_count === 0 ? 'empty' : ''}">
        ${buildSlots(c.tomorrow_slots, 'tomorrow-pill')}
      </div>
    </div>
  `).join('');

  document.getElementById('mainContent').innerHTML = rows || '<div class="loading">No closers found.</div>';
}

loadData();
</script>
</body>
</html>
